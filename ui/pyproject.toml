[project]
name = "ee-gateway-ui"
version = "0.6.5"
description = "EE Gateway UI — setup wizard and dashboard for the EE Gateway Hubble BLE gateway."
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
dependencies = [
    "flask",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Single-level globs only — setuptools does not recurse "*". Every static
# subtree must be listed, or `pip install .` silently drops it from the
# Docker image while dev checkouts keep working (this bit the Inter font:
# it fell back to system sans in prod for three releases before 0.6.5).
ee_gateway_ui = [
    "templates/*.html",
    "static/*.css",
    "static/fonts/*",
    "static/vendor/leaflet/*",
    "static/vendor/leaflet/images/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
