[project]
name = "ee-gateway-ui"
version = "0.6.4"
description = "EE Gateway UI — setup wizard and dashboard for the EE Gateway Hubble BLE gateway."
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
dependencies = [
    "flask",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ee_gateway_ui = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
