# Copyright (C) 2026 encryptedenergy.com
# SPDX-License-Identifier: GPL-3.0-only
#
# Two services share ${APP_DATA_DIR}/data (mounted at /data) for file-based
# IPC: the UI writes config.json, the worker writes state.json and packets.db.
# They never communicate over the network, so the worker can run on the host
# network (which it needs to reach the Bluetooth radio) while the UI stays on
# Umbrel's app network behind app_proxy.
#
# Credentials are NOT passed as environment variables here. The user enters the
# Hubble org id and API token once in the UI setup wizard, which writes them to
# config.json in the shared volume; the worker reads that file every scan cycle.
#
# umbreld creates ${APP_DATA_DIR}/data owned by root, but both app containers
# run as uid 1000 and so cannot write it. The init_perms service fixes ownership
# once before the app containers start. The worker also carries a restart policy
# so a transient Bluetooth or D-Bus error on real hardware self-heals.

version: "3.7"

services:

  # Umbrel's reverse proxy. It terminates Umbrel auth and forwards to the UI.
  # APP_HOST format is <app-id>_<compose-service-name>_1.
  app_proxy:
    environment:
      APP_HOST: encryptedenergy-ee-gateway_ui_1
      APP_PORT: 8080

  # One-time root init. umbreld creates the shared /data dir owned by root; both
  # app containers run as uid 1000 and cannot write it. This chowns /data to
  # 1000:1000 and exits. It reuses the already-pulled worker image so there is no
  # extra download, and it is the only place root is used. This is NOT privileged
  # mode; the app containers themselves stay non-root.
  init_perms:
    image: encryptedenergy/ee-gateway-worker:0.6.3
    user: "0:0"
    entrypoint: ["sh", "-c", "chown -R 1000:1000 /data"]
    restart: "no"
    volumes:
      - ${APP_DATA_DIR}/data:/data

  # Flask setup wizard + status dashboard. Fully unprivileged: no host network,
  # no added capabilities, no Bluetooth access. Runs as uid 1000 (set in the
  # image). init: true so SIGTERM reaches Flask for a clean shutdown.
  ui:
    image: encryptedenergy/ee-gateway-ui:0.4.0
    init: true
    depends_on:
      init_perms:
        condition: service_completed_successfully
    volumes:
      - ${APP_DATA_DIR}/data:/data
    # Both values already default correctly inside the image; they are restated
    # here so the IPC and proxy contract is visible at the composition layer.
    environment:
      EE_DATA_DIR: /data
      EE_UI_PORT: 8080

  # BLE scan + GPS-stamped cloud ingest worker. It reaches the host's
  # Bluetooth radio through bluetoothd over the D-Bus system bus, talks to
  # a bundled gpsd against a USB GPS dongle for per-packet coordinates,
  # and makes outbound HTTPS calls to encryptedenergy.com. The Python
  # process runs as uid 1000; gpsd starts as root only to open the
  # serial device, then drops to user nobody.
  worker:
    image: encryptedenergy/ee-gateway-worker:0.6.3
    init: true
    # Wait for the one-time ownership fix, then self-heal on any non-zero exit
    # (a transient radio or D-Bus error, or a start that raced init_perms). In
    # umbrel-dev there is no Bluetooth radio, so after setup the worker will
    # restart-loop on a bluez timeout; that is a dev-only artifact and does not
    # happen on a Pi with a real adapter.
    restart: on-failure
    depends_on:
      init_perms:
        condition: service_completed_successfully
    # Host networking gives the container direct use of the host Bluetooth
    # stack and a normal outbound route to encryptedenergy.com. Note: gpsd
    # inside the container binds 127.0.0.1:2947 on the *host* because of
    # this. If umbrelOS ever ships its own gpsd in a future release we
    # will need to either move worker off host networking (and add a
    # bluetoothd unix-domain shim) or pick a non-default port via
    # gpsd -S; today no other umbrelOS app uses gpsd.
    network_mode: host
    # The only privilege grant for BLE: NET_ADMIN + NET_RAW let the
    # Bluetooth stack manage and read from the radio. Deliberately NO
    # `privileged: true`.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # USB device access for the GPS dongle. Two layers:
    #
    # 1) `device_cgroup_rules` grants the container permission to access
    #    character devices with major 188 (USB serial, e.g. PL2303 ->
    #    ttyUSB*) and 166 (CDC ACM, e.g. u-blox NEO -> ttyACM*). The
    #    rule is permission only; without step 2 the device nodes are
    #    not present inside the container's tmpfs /dev.
    #
    # 2) Bind-mounting the host's /dev INTO the container's /dev makes
    #    the actual device nodes visible. This is broader than a single
    #    `devices:` entry but matters for two reasons:
    #      * Survives hot-plug: a USB GPS dongle plugged in AFTER the
    #        container started becomes visible without rebuilding the
    #        container.
    #      * No-dongle install works: the container starts cleanly even
    #        if no GPS dongle is present at install time (worker reports
    #        dongle_missing on the dashboard).
    #    The cgroup_rules above keep the container from actually opening
    #    any device outside the two allowed majors.
    device_cgroup_rules:
      - 'c 188:* rwm'
      - 'c 166:* rwm'
    volumes:
      - ${APP_DATA_DIR}/data:/data
      # D-Bus system bus, read-only: the worker speaks to the host bluetoothd
      # over the bus but never needs to write the bus directory.
      - /var/run/dbus:/var/run/dbus:ro
      # Full /dev passthrough so the GPS dongle's tty node is visible to
      # the container at the path EE_GPS_DEVICE points at. See the
      # block-comment above for why this is broader than `devices:`.
      - /dev:/dev
    environment:
      EE_DATA_DIR: /data
      # Override here if your dongle enumerates as /dev/ttyACM0 (u-blox).
      EE_GPS_DEVICE: /dev/ttyUSB0
