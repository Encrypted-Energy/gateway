#
# Listing metadata shown in the umbrelOS UI. The app is distributed through the
# encryptedenergy community app store, so the id is prefixed with that store id
# (store id "encryptedenergy" + app "ee-gateway" => "encryptedenergy-ee-gateway").
#
# The icon and gallery URLs point at the community-app-store repo where this
# folder is published (see umbrel/ -> Step 10). They resolve once that repo is
# pushed; until then they 404, which is expected pre-publish.
manifestVersion: 1
id: encryptedenergy-ee-gateway
name: EE Gateway
tagline: Self-hosted Hubble Network Bluetooth gateway
icon: https://raw.githubusercontent.com/encryptedenergy/umbrel-community-app-store/main/encryptedenergy-ee-gateway/icon.svg
category: Networking
version: "0.1.0"
port: 8080
description: >-
  EE Gateway turns your Umbrel into a self-hosted Hubble Network Bluetooth
  gateway.


  It scans with your device's Bluetooth radio for nearby Hubble Network devices
  and forwards their packets to the Hubble cloud, extending coverage for the
  global Hubble Network from hardware you already own.


  Two containers do the work: a worker that scans over Bluetooth and ingests
  packets to Hubble, and a small web dashboard for first-time setup and live
  status. Enter your Hubble organization ID and API token once in the setup
  wizard, and the gateway runs on its own.


  EE Gateway is free and open-source software (GPL-3.0-only), built by
  encryptedenergy.com. It is an independent community project and is not an
  official Hubble Network product.
developer: encryptedenergy.com
website: https://encryptedenergy.com
submitter: John Marbach
submission: https://github.com/encryptedenergy/ee-gateway
repo: https://github.com/encryptedenergy/ee-gateway
support: https://github.com/encryptedenergy/ee-gateway/issues
gallery:
  - https://raw.githubusercontent.com/encryptedenergy/umbrel-community-app-store/main/encryptedenergy-ee-gateway/gallery/1-setup.png
  - https://raw.githubusercontent.com/encryptedenergy/umbrel-community-app-store/main/encryptedenergy-ee-gateway/gallery/2-dashboard.png
  - https://raw.githubusercontent.com/encryptedenergy/umbrel-community-app-store/main/encryptedenergy-ee-gateway/gallery/3-status.png
releaseNotes: >-
  First public release of EE Gateway. Scans for Hubble Network BLE packets and
  ingests them to the Hubble cloud, with a one-time setup wizard and a live
  status dashboard. Two-container design: an unprivileged UI behind Umbrel's
  app proxy and a worker with scoped Bluetooth access (no privileged mode).
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
