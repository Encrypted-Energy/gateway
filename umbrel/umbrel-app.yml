  - https://raw.githubusercontent.com/Encrypted-Energy/umbrel-community-app-store/main/encryptedenergy-ee-gateway/gallery/2-dashboard.png
  - https://raw.githubusercontent.com/Encrypted-Energy/umbrel-community-app-store/main/encryptedenergy-ee-gateway/gallery/3-status.png
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
